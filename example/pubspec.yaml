name: configdirector_flutter_sample_app
description: "Sample app for the ConfigDirector Flutter client SDK."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.4.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  # The SDK is not published yet, so the `dependency_overrides` section below
  # points pub at the package this app lives in. Once it is published, delete
  # that section and this dependency resolves from pub.dev with nothing else to
  # change here.
  configdirector_flutter_client_sdk: ^0.0.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Resolves `configdirector_flutter_client_sdk` from this repository rather than
# from pub.dev. Delete this section once the package is published.
dependency_overrides:
  configdirector_flutter_client_sdk:
    path: ../

flutter:
  uses-material-design: true
