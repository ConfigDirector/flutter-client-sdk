name: Build and Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned, publish.yml pins the same version.
  FLUTTER_VERSION: 3.44.8

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: any
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed --language-version=latest .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test example app
        run: flutter test
        working-directory: example

  test_by_platform:
    # The SDK compiles for both the Dart VM and the web, and the two disagree
    # about numbers, platform APIs, and conditional imports, so each gets a run.
    name: test (${{ matrix.os }}, ${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: tester
          - os: ubuntu-latest
            platform: chrome
    steps:
      - uses: actions/checkout@v5

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test --platform ${{ matrix.platform }}

  test_by_version:
    name: "test (dart: ${{ matrix.dart }}, flutter: ${{ matrix.flutter }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dart: stable
            flutter: 3.22.0
          - dart: stable
            flutter: 3.44.8
    steps:
      - uses: actions/checkout@v5

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.dart }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter }}
          channel: any
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test
