name: configdirector_flutter_client_sdk
description: "Flutter client SDK for ConfigDirector. ConfigDirector is a remote configuration and feature flag service."
version: 0.0.2
homepage: https://www.configdirector.com

environment:
  sdk: ^3.4.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  # Used to read the host app's name and version when they are not supplied
  # through the client options. 10.x requires Dart ^3.10.0, so a single
  # `^10.0.0` would make `pub get` fail on the oldest SDK this package supports.
  # The range lets a modern toolchain resolve 10.x while the minimum-version CI
  # job resolves 9.x.
  package_info_plus: ">=8.0.2 <11.0.0"
  uuid: ^4.6.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # 6.x requires Dart ^3.8.0, so a single `^6.0.0` would make `pub get` fail on
  # the oldest SDK this package supports. The range lets a modern toolchain lint
  # with 6.x while the minimum-version CI job resolves 4.x.
  flutter_lints: ">=4.0.0 <7.0.0"
  # `flutter_test` pins an exact `fake_async` from the Flutter SDK (1.3.1 on
  # Flutter 3.22), so this constraint has to admit the pinned version of every
  # Flutter release the package supports.
  fake_async: ^1.3.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # To add assets to your package, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/to/asset-from-package
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # To add custom fonts to your package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
