name: configdirector_flutter_client_sdk
description: "Flutter client SDK for ConfigDirector. ConfigDirector is a remote configuration and feature flag service."
version: 1.0.0
homepage: https://www.configdirector.com
repository: https://github.com/ConfigDirector/flutter-client-sdk
issue_tracker: https://github.com/ConfigDirector/flutter-client-sdk/issues
documentation: https://docs.configdirector.com/sdks/mobile/flutter

topics:
  - feature-flags
  - remote-config
  - configuration

environment:
  sdk: ^3.4.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  collection: ^1.18.0
  crypto: ^3.0.3
  http: ^1.6.0
  package_info_plus: ">=8.0.2 <11.0.0"
  uuid: ^4.6.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=4.0.0 <7.0.0"
  fake_async: ^1.3.1

# The following section is specific to Flutter packages.
flutter:
